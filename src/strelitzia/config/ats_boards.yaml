# Company job boards hosted on Greenhouse, Lever or Ashby (public JSON APIs, no bot protection).
# Each entry: name (stored as the job's site), kind (greenhouse|lever|ashby), slug (the board token
# in the careers URL, e.g. boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>).
# Jobs are kept when their title contains every word of one of your searches.yaml queries and
# their location passes your location filter. Every slug below answered HTTP 200 on 2026-10-02.
boards:
