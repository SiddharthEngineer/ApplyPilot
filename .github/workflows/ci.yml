name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

# Back-to-back pushes (e.g. the nightly build) queue many runs; keep only the newest per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install dependencies
        # Same as scripts/validate.sh --setup. The jobspy extra pins python-jobspy (pyproject.toml).
        run: |
          uv pip install -e ".[dev,web,jobspy]"

      - name: Lint
        # Rule set is pinned in pyproject.toml ([tool.ruff.lint]).
        run: ruff check src/ tests/ scripts/

      - name: Test
        run: pytest tests/ -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci --prefix dashboard

      - name: Test
        run: npm test --prefix dashboard

      - name: Build
        run: npm run build --prefix dashboard

      - name: Committed bundle is current
        # Same check as scripts/validate.sh --full.
        run: |
          if [ -n "$(git status --porcelain -- src/strelitzia/web/static)" ]; then
            git status --porcelain -- src/strelitzia/web/static
            echo "::error::The committed dashboard bundle is stale. Run 'npm run build --prefix dashboard' and commit src/strelitzia/web/static."
            exit 1
          fi
