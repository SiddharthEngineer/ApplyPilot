name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

# Back-to-back pushes (e.g. the nightly build) queue many runs; keep only the newest per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install dependencies
        # Same as scripts/validate.sh --setup. python-jobspy 1.2.0 no longer needs --no-deps.
        run: |
          uv pip install -e ".[dev,web]" "python-jobspy==1.2.0"

      - name: Lint
        # Rule set is pinned in pyproject.toml ([tool.ruff.lint]).
        run: ruff check src/ tests/ scripts/

      - name: Test
        run: pytest tests/ -q
