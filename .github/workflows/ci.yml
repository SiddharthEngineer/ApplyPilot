name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Install dependencies
        # Same as scripts/cloud_setup.sh. python-jobspy 1.2.0 no longer needs --no-deps.
        run: |
          uv pip install -e ".[dev]" "python-jobspy==1.2.0"

      - name: Lint (errors only)
        # The default ruff rule set reports ~150 pre-existing style findings; CI gates on real errors only.
        run: ruff check src/ tests/ scripts/ --select E9,F63,F7,F82

      - name: Test
        run: pytest tests/ -q
