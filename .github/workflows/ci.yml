name: CI

on:
  pull_request:
    branches: [trunk]
  push:
    branches: [trunk]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # python-jobspy pins numpy==1.26.3, so install it without deps and add its runtime deps explicitly
        # (same as scripts/cloud_setup.sh).
        run: |
          uv pip install -e ".[dev]"
          uv pip install "python-jobspy==1.1.82" --no-deps
          uv pip install markdownify pydantic regex requests tls-client numpy

      - name: Lint (errors only)
        # The default ruff rule set reports ~150 pre-existing style findings; CI gates on real errors only.
        run: ruff check src/ tests/ scripts/ --select E9,F63,F7,F82

      - name: Test
        run: pytest tests/ -q
