[project]
name = "strelitzia"
version = "0.4.0"
description = "Job discovery, scoring and tailoring, with a dashboard to track your applications"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Siddharth Engineer"}, {name = "Pickle-Pixel"}]  # Pickle-Pixel: original ApplyPilot author
keywords = ["job-search", "ai", "resume", "job-application", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "anthropic>=1,<2",
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "jinja2>=3.1",
    "pypdf>=4",  # BSD: reads rendered PDFs back (ATS round-trip and hidden-text checks)
    "python-docx>=1.1",  # MIT: the DOCX resume next to the PDF
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
drive = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
jobspy = ["python-jobspy==1.2.0"]
postgres = ["psycopg[binary]>=3.2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "itsdangerous>=2.1", "google-auth[requests]>=2.20", "cryptography>=42",
       "python-multipart>=0.0.9"]

[project.scripts]
strelitzia = "strelitzia.cli:app"
# Deprecated alias for 0.4.x (the legacy name): prints a notice on stderr, then runs strelitzia.
applypilot = "strelitzia.cli:legacy_main"

[project.urls]
Homepage = "https://github.com/SiddharthEngineer/Strelitzia"
Repository = "https://github.com/SiddharthEngineer/Strelitzia"
Issues = "https://github.com/SiddharthEngineer/Strelitzia/issues"
Upstream = "https://github.com/Pickle-Pixel/ApplyPilot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strelitzia"]

[tool.hatch.build]
artifacts = ["src/strelitzia/config/*.yaml", "src/strelitzia/config/*.json", "src/strelitzia/config/*.html", "src/strelitzia/web/static/**"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Real errors and pyflakes (unused imports/variables, undefined names). Pinned so `ruff check` means the same thing in CI, hooks and agents.
select = ["E9", "F"]

[tool.pytest.ini_options]
markers = [
    "live: real network/Playwright tests (requires --run-live)",
    "llm: real Gemini/API calls (requires --run-llm)",
    "expensive: live or llm tests (requires --run-live or --run-llm)",
    "pg: Postgres backend tests (require STRELITZIA_TEST_DATABASE_URL; skipped without it)",
]
