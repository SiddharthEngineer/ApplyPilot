[project]
name = "applypilot"
version = "0.3.1"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "jinja2>=3.1",
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
drive = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
postgres = ["psycopg[binary]>=3.2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
applypilot = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/Pickle-Pixel/ApplyPilot"
Repository = "https://github.com/Pickle-Pixel/ApplyPilot"
Issues = "https://github.com/Pickle-Pixel/ApplyPilot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml", "src/applypilot/config/*.html", "src/applypilot/web/static/**"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
markers = [
    "live: real network/Playwright tests (requires --run-live)",
    "llm: real Gemini/API calls (requires --run-llm)",
    "expensive: live or llm tests (requires --run-live or --run-llm)",
    "pg: Postgres backend tests (require APPLYPILOT_TEST_DATABASE_URL; skipped without it)",
]
